[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "task-scaffolder"
version = "1.0.0"
description = "Deterministic scaffolding of reproducible coding-challenge environments from real repository fixes, with F2P/P2P verification harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Souq AL_Bostan" }]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.122.3",
    "ruff==0.8.2",
    "mypy==1.13.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property", "tests/integration"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["requests.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.coverage.run]
source = ["task_scaffolder"]
branch = true
